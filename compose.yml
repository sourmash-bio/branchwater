services:
  index:
    image: ghcr.io/sourmash-bio/branchwater:index-0.6.3
    build:
      context: .
      dockerfile: Dockerfile
      target: index
    restart: always
    volumes:
      - ./bw_db:/data/
    env_file:
      - prod.index.env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3059/health"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s

  app:
    image: ghcr.io/sourmash-bio/branchwater:web-0.6.3
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      index:
        condition: service_healthy
    volumes:
      - ./bw_db:/data/
    env_file:
      - prod.env
    command: >
      gunicorn
        --bind 0.0.0.0:8000
        --timeout 120
        --workers 4
        --access-logfile -
        main:app
